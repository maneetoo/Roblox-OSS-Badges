name: Package Files

on:
  workflow_call:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Prepare staging folder
        run: |
          mkdir -p staging
          cp README.md staging/ 2>/dev/null || echo "README.md not found, skipping"
          cp LICENSE staging/ 2>/dev/null || echo "LICENSE not found, skipping"
          cp CHANGELOG.md staging/ 2>/dev/null || echo "CHANGELOG.md not found, skipping"
          cp package.json staging/ 2>/dev/null || echo "package.json not found, skipping"
          [ -d Badges ] && cp -r Badges staging/ || echo "Badges/ not found, skipping"

      - name: Create archives
        run: |
          cd staging
          zip -r ../release-assets.zip .
          tar -cf ../release-assets.tar .
          7z a ../release-assets.7z .

      - name: Upload archives as artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            release-assets.zip
            release-assets.tar
            release-assets.7z
